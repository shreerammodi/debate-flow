[package]
name = "ebb"
version = "0.7.2"
description = "ebb - keyboard-first debate flow"
authors = ["Shreeram Modi <smodi@smodi.net>"]
license = "MPL-2.0"
edition = "2021"
# iroh 1.0 sets this floor; nothing else in the tree needs more than 1.77.
rust-version = "1.91"

# The library is what Tauri runs; main.rs is a thin entrypoint that calls into
# it. This split keeps a single `run()` shared between desktop and (future)
# mobile entrypoints.
[lib]
name = "ebb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# Native open/save pickers, system-browser links plus reveal-in-file-manager.
# The filesystem plugin is deliberately absent: flow I/O goes through the narrow
# commands in flowfile.rs rather than a general filesystem API for the webview.
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Plain-text config file sync: notify watches it for external edits, toml_edit
# rewrites it in place so hand-added comments and formatting survive.
notify = "6"
toml_edit = { version = "0.22", features = ["serde"] }
# cardmirror-bridge transport. Both legs are loopback-only, so ureq is built
# without its TLS feature and no certificate stack enters the binary. tiny_http
# is a blocking server driven from one dedicated thread, which keeps the shell
# free of an async runtime. subtle supplies the constant-time token compare.
tiny_http = "0.12"
ureq = { version = "2", default-features = false }
rand = "0.8"
subtle = "2"
parking_lot = "0.12"
# Shared editing. iroh dials a peer by public key and hole punches to it, which
# is the only design that reaches two homes behind NAT. mDNS is a separate
# crate so the same-room case needs no internet at all; the DNS and DHT lookup
# crates are deliberately not dependencies, so that code is not in the binary
# and an idle ebb cannot publish itself anywhere.
iroh = "1"
iroh-mdns-address-lookup = "0.4"
# iroh is async, so the collab module owns one runtime. The rest of the shell
# stays synchronous, the way tiny_http does on its own thread.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "sync"] }

# Signed auto-updates. The updater verifies the Ed25519 signature internally and
# discards anything it can't verify; `process` provides the relaunch used to
# apply a staged update. Both are desktop-only.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# A double-clicked .ebb on Windows or Linux launches a second process; this
# hands its argv to the running one so two copies never autosave over one file.
tauri-plugin-single-instance = "2"

[features]
# This feature is used for production builds where the developer tools are
# disabled and Cmd+R reload is neutralized. `tauri dev` runs without it.
custom-protocol = ["tauri/custom-protocol"]
